# Local development stack.
#
# Two services are declared but profile-gated because nothing runs in them yet:
#   worker   — no arq tasks exist until the first background job lands
#   langfuse — no LLM calls to trace until M2
# Both start with an explicit profile, e.g. `docker compose --profile tracing up`.
# They lose their profiles (and `make dev` starts all six) in the slice that
# gives each one work to do.

name: hotelagent

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: uvicorn hotelagent.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      HOTELAGENT_ENV: local
      HOTELAGENT_DATABASE_URL: postgresql+asyncpg://hotelagent:hotelagent@postgres:5432/hotelagent
      HOTELAGENT_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ops:
    build:
      context: ./apps/ops
    command: npm run dev
    environment:
      # Two URLs for one API, because two different machines ask for it. The
      # console renders on the server, inside this container, where the API is
      # reachable as `api` on the Compose network. NEXT_PUBLIC_* is inlined into
      # the browser bundle, and a browser on the host can only see localhost.
      OPS_API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/ops:/app
      - /app/node_modules
      - /app/.next

  postgres:
    # pgvector ships with the KB module at M3; the image carries it from day one
    # so the extension is a migration, not a rebuild.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hotelagent
      POSTGRES_PASSWORD: hotelagent
      POSTGRES_DB: hotelagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelagent -d hotelagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: arq hotelagent.workers.WorkerSettings
    environment:
      HOTELAGENT_ENV: local
      HOTELAGENT_DATABASE_URL: postgresql+asyncpg://hotelagent:hotelagent@postgres:5432/hotelagent
      HOTELAGENT_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api/src:/app/apps/api/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  langfuse:
    profiles: ["tracing"]
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://hotelagent:hotelagent@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: local-dev-only-not-a-secret
      SALT: local-dev-only-not-a-secret
      TELEMETRY_ENABLED: "false"
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
