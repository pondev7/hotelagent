# CI runs exactly the same commands you run locally. If `make lint` and
# `make test` pass on your machine, they pass here — there is no separate CI
# incantation to keep in sync, which is a large part of why every command lives
# in the Makefile.

name: CI

on:
  push:
    branches: [main, "m1/**", "m2/**"]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run — no point spending
# minutes on a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Integration tests need a real PostgreSQL. A service container runs
    # alongside the job for its lifetime; the health options make the runner
    # wait until Postgres actually accepts connections before the first step,
    # otherwise the tests race the database's startup.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hotelagent
          POSTGRES_PASSWORD: hotelagent
          POSTGRES_DB: hotelagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotelagent -d hotelagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The service is published on the runner's localhost, matching the
      # defaults in config.py.
      HOTELAGENT_DATABASE_URL: postgresql+asyncpg://hotelagent:hotelagent@localhost:5432/hotelagent
      HOTELAGENT_TEST_DATABASE_URL: postgresql+asyncpg://hotelagent:hotelagent@localhost:5432/hotelagent_test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          # Caches the uv download cache keyed on uv.lock, so unchanged
          # dependencies are not re-downloaded on every run.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        # --frozen fails if uv.lock disagrees with pyproject.toml, which catches
        # a dependency added without regenerating the lockfile.
        run: uv sync --frozen

      # `lint-api`/`test-api` rather than `lint`/`test`: those now also drive the
      # console, and this job has no Node toolchain to do it with. The `ops` job
      # runs the other half, in parallel, so a Python failure and a TypeScript
      # failure are two red jobs rather than one confusing one.
      - name: Lint (ruff check, ruff format --check, mypy)
        run: make lint-api

      - name: Test
        run: make test-api

  ops:
    name: Ops console — typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Python is here to generate TypeScript, which reads like a mistake and is
      # not: `packages/contracts/src/generated.ts` is gitignored and derived from
      # the API's OpenAPI document, so producing it means importing the FastAPI
      # app. The alternative — committing the generated file — trades this
      # toolchain for merge conflicts in a machine-written 1000-line file.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/ops/package-lock.json
            packages/contracts/package-lock.json

      # Regenerates the contracts and fails if the generated types no longer
      # typecheck against the names `src/index.ts` expects — the drift check.
      - name: Generate contracts
        run: make contracts

      - name: Typecheck the console
        run: make lint-ops

      - name: Test the console
        run: make test-ops

      # The build is a third distinct check: `tsc` does not catch a server
      # component that imports a client-only hook, or a page that fails to
      # prerender. Those surface here and nowhere else.
      - name: Build the console
        run: npm --prefix apps/ops run build
