# Alembic configuration.
#
# Invoked from the repository root via `make migrate`, so script_location is
# relative to the root. There is deliberately no sqlalchemy.url here: the URL
# comes from Settings (invariant #9 — all configuration through environment
# variables), and tests override it in-process.

[alembic]
script_location = apps/api/alembic
prepend_sys_path = apps/api/src
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
