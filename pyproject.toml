[project]
name = "hotelagent"
version = "0.1.0"
description = "WhatsApp-first hotel booking concierge for Kanyakumari"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "structlog>=24.4",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/hotelagent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/api/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID"]

# Invariant #9 and the module boundary rule are enforced here, not just in review:
# no module may import another module's internals, and no provider SDK may be
# imported outside adapters/. Populated as modules land.
[tool.ruff.lint.flake8-tidy-imports.banned-api]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api/src"
packages = ["hotelagent"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/src"]
asyncio_mode = "auto"
