[project]
name = "hotelagent"
version = "0.1.0"
description = "WhatsApp-first hotel booking concierge for Kanyakumari"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "structlog>=24.4",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/hotelagent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/api/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID"]

# The module boundary rule and invariant #9 are enforced by
# apps/api/tests/unit/test_module_boundaries.py, not here.
#
# ruff's banned-api is global, and these rules are contextual: `conversation`
# may import its own models, `channel` may not. No global ban can say "except
# from inside itself", so the check reads the source with `ast` instead.
[tool.ruff.lint.flake8-tidy-imports.banned-api]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api/src"
packages = ["hotelagent"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/src"]
asyncio_mode = "auto"
